<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4EEDF">
  <title>胶带素材 · Tape Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <span class="app-version" id="appVersion"></span>

    <header class="app-header">
      <h1 class="app-title">胶带素材</h1>
      <span class="app-subtitle">TAPE STUDIO</span>
    </header>

    <main class="app-main">
      <!-- 预览：透明底棋盘格 -->
      <section class="preview-section">
        <div class="preview-sheet">
          <div class="preview-wrapper">
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>
      </section>

      <section class="controls-section">
        <!-- 1. 纹理 -->
        <div class="paper-card">
          <button type="button" class="card-title" aria-expanded="true">
            <span class="card-sign" aria-hidden="true"></span>
            纹理
          </button>
          <div class="card-body">
            <div class="card-body-inner">
              <div class="texture-grid" id="textureGrid"></div>
            </div>
          </div>
        </div>

        <!-- 2. 形态 -->
        <div class="paper-card">
          <button type="button" class="card-title" aria-expanded="true">
            <span class="card-sign" aria-hidden="true"></span>
            形态
          </button>
          <div class="card-body">
            <div class="card-body-inner">
              <div class="control-group">
                <div class="label-row">
                  <label class="control-label" for="lengthSlider">长度</label>
                  <span id="lengthValue" class="value-label">9.0 cm</span>
                </div>
                <input type="range" id="lengthSlider" class="slider" min="4" max="14" value="9" step="0.5">
                <p class="group-hint">按现实手帐尺度的示意值，随手剪一截常见 5–10cm</p>
              </div>

              <div class="control-group">
                <span class="control-label">宽度</span>
                <div class="segmented-control" data-seg="width">
                  <span class="seg-indicator" aria-hidden="true"></span>
                  <button type="button" class="seg-btn" data-value="thin">细款</button>
                  <button type="button" class="seg-btn active" data-value="normal">常规</button>
                  <button type="button" class="seg-btn" data-value="wide">宽版</button>
                </div>
              </div>

              <div class="control-group">
                <div class="label-row">
                  <label class="control-label" for="tiltSlider">倾斜角</label>
                  <span id="tiltValue" class="value-label">3°</span>
                </div>
                <input type="range" id="tiltSlider" class="slider" min="-8" max="8" value="3" step="0.5">
              </div>
            </div>
          </div>
        </div>

        <!-- 3. 端头 -->
        <div class="paper-card">
          <button type="button" class="card-title" aria-expanded="true">
            <span class="card-sign" aria-hidden="true"></span>
            端头
          </button>
          <div class="card-body">
            <div class="card-body-inner">
              <div class="control-group">
                <span class="control-label">左端</span>
                <div class="segmented-control" data-seg="endLeft">
                  <span class="seg-indicator" aria-hidden="true"></span>
                  <button type="button" class="seg-btn" data-value="straight">直边</button>
                  <button type="button" class="seg-btn active" data-value="wave">波浪</button>
                  <button type="button" class="seg-btn" data-value="tear">手撕</button>
                </div>
              </div>
              <div class="control-group">
                <span class="control-label">右端</span>
                <div class="segmented-control" data-seg="endRight">
                  <span class="seg-indicator" aria-hidden="true"></span>
                  <button type="button" class="seg-btn" data-value="straight">直边</button>
                  <button type="button" class="seg-btn active" data-value="wave">波浪</button>
                  <button type="button" class="seg-btn" data-value="tear">手撕</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 4. 效果：折痕 + 凹凸（凹凸暂留位置） -->
        <div class="paper-card">
          <button type="button" class="card-title" aria-expanded="true">
            <span class="card-sign" aria-hidden="true"></span>
            效果
          </button>
          <div class="card-body">
            <div class="card-body-inner">
              <div class="control-group">
                <span class="control-label">折痕</span>
                <div class="chip-group" data-chip="fold">
                  <button type="button" class="chip" data-value="none">无</button>
                  <button type="button" class="chip active" data-value="one">折一下</button>
                  <button type="button" class="chip" data-value="two">折两下</button>
                  <button type="button" class="chip" data-value="curl">卷边</button>
                  <button type="button" class="chip" data-value="lift">翘起</button>
                </div>
              </div>

              <div class="control-group">
                <div class="label-row">
                  <span class="control-label">凹凸</span>
                  <span class="tag-soon">开发中</span>
                </div>
                <div class="chip-group">
                  <button type="button" class="chip is-disabled" disabled>贴边隆起</button>
                </div>
                <p class="group-hint">胶带压过拍立得、卡片的那一段会比压在纸上的部分微微隆起，叠出层次。具体做法还在琢磨，先把位置留在这里。</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 下载 -->
        <div class="action-group">
          <button id="downloadBtn" class="btn btn-primary">下载透明 PNG</button>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <span>贾斯伯还是吉努都可以</span>
  </footer>

  <!-- 手机端：大图预览，长按保存 -->
  <div class="modal" id="saveModal" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="保存图片">
      <button type="button" class="modal-close" id="saveModalClose" aria-label="关闭">×</button>
      <p class="modal-hint">长按图片保存到相册</p>
      <img id="saveModalImg" alt="生成的透明胶带" />
    </div>
  </div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
